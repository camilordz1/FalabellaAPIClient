[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "falabella-sdk"
dynamic = ["version"]
description = "Unofficial Python SDK for the Falabella Seller Center API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Camilo Andrés Rodríguez Higuera", email = "andres.roh@outlook.com"},
]
dependencies = ["requests>=2.31"]
keywords = ["python", "falabella", "seller center", "api client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "freezegun>=1.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/camilordz1/FalabellaAPIClient"
Source = "https://github.com/camilordz1/FalabellaAPIClient"
Issues = "https://github.com/camilordz1/FalabellaAPIClient/issues"

[tool.setuptools.dynamic]
version = {attr = "falabella_sdk.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

